<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1920, initial-scale=1, user-scalable=no"/>
  <title>Stremio</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div id="splash">
    <div class="splash-logo"></div>
  </div>

  <div id="app" style="display:none">
    <div id="backdrop"></div>
    <div id="infobar">
      <div class="ib-info" id="ib-info"></div>
    </div>
    <aside id="sidebar">
      <div class="side-tabs" id="side-tabs"></div>
      <div class="side-profile" id="side-profile" data-focus="1">
        <span class="avatar" id="avatar"></span>
        <span class="profile-name" id="profile-name">Guest</span>
      </div>
    </aside>

    <main id="main">
      <div id="view"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modal-layer" class="layer hidden"></div>
  <div id="keyboard-layer" class="layer hidden"></div>
  <div id="player-layer" class="layer hidden"></div>

  <!-- On-device torrent engine (NaCl). Invisible PPAPI module. -->
  <div id="engine-listener" style="position:absolute;width:0;height:0">
    <embed id="stremio-engine" type="application/x-nacl"
           src="nacl/stremio_engine.nmf" width="0" height="0" style="width:0;height:0;border:0"/>
  </div>

  <!-- Samsung TV web APIs (AVPlay native player). Resolved by the TV runtime. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="js/avplayer.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
